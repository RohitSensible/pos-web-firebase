name: Project push cards

on:
  push:
    branches: ['Testing']
  workflow_dispatch:
    inputs:
      historical_push:
        description: 'Backfill the verified 2026-11-05 Testing push (one card)'
        required: true
        type: choice
        options: ['26235005796']

# The repository token reads push/commit metadata only. Project writes use the
# separately configured PROJECT_PUSH_CARDS_TOKEN secret, never this token.
permissions:
  contents: read

env:
  EXPECTED_REPOSITORY: RohitSensible/pos-web-firebase
  PROJECT_ID: PVT_kwHOFPGHys4Bp-Qf
  STATUS_FIELD_ID: PVTSSF_lAHOFPGHys4Bp-QfzhoXZ2w
  IN_PROGRESS_OPTION_ID: 47fc9ee4

jobs:
  identify:
    if: github.repository == 'RohitSensible/pos-web-firebase' && (github.event_name == 'workflow_dispatch' || github.event.deleted != true)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      push: ${{ steps.push.outputs.push }}
      key: ${{ steps.push.outputs.key }}
    steps:
      - name: Identify the original push and its actual timestamp
        id: push
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const payload = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const repository = process.env.EXPECTED_REPOSITORY;
          let push;
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            if (payload.inputs?.historical_push !== '26235005796') throw new Error('Unsupported historical push.');
            // Observed repository PushEvent, NOT a commit date or an estimated push date.
            push = {
              id: '26235005796', repository, ref: 'refs/heads/Testing',
              before: 'df0f4e43d8ff1a377ea2a36227cf149ce1e984e7',
              after: '7a286ea6e0e3c3ef0e3caef81c38456e6d19d41d',
              createdAt: '2026-11-05T12:17:16Z', historical: true,
            };
          } else {
            if (payload.repository?.full_name !== repository || !payload.ref?.startsWith('refs/heads/')) {
              throw new Error('Unexpected repository or non-branch push.');
            }
            // Use the repository push timestamp captured in THIS webhook payload,
            // not a later REST repository snapshot, commit date, or workflow start.
            // The original payload survives reruns and avoids the delayed Events feed.
            const pushedAt = payload.repository.pushed_at;
            const milliseconds = typeof pushedAt === 'number' ? pushedAt * 1000 :
              typeof pushedAt === 'string' && /^\d+$/.test(pushedAt) ? Number(pushedAt) * 1000 :
              typeof pushedAt === 'string' ? Date.parse(pushedAt) : NaN;
            if (!Number.isFinite(milliseconds) || milliseconds <= 0 || !Number.isFinite(new Date(milliseconds).getTime())) {
              throw new Error('Original push payload has no valid repository.pushed_at timestamp. Refusing to invent a push date.');
            }
            const createdAt = new Date(milliseconds).toISOString();
            // Stable across redelivery/reruns; the timestamp also distinguishes
            // separate pushes that happen to repeat the same before/after range.
            push = { id: `payload:${createdAt}`, repository, ref: payload.ref,
              before: payload.before, after: payload.after, createdAt, historical: false };
          }
          if (!(push.historical ? /^\d+$/.test(push.id) : push.id === `payload:${push.createdAt}`) ||
              !/^refs\/heads\/.+/.test(push.ref) ||
              !/^[0-9a-f]{40}$/.test(push.before) || !/^[0-9a-f]{40}$/.test(push.after) ||
              /^0+$/.test(push.after) || !Number.isFinite(Date.parse(push.createdAt))) {
            throw new Error('Invalid push metadata.');
          }
          const key = createHash('sha256').update(JSON.stringify([
            push.repository, push.ref, push.before, push.after, push.id,
          ])).digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT, `push=${JSON.stringify(push)}\nkey=${key}\n`);
          NODE

  card:
    needs: identify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Separate pushes do not share a queue. Retries of THIS push serialize, with
    # cancellation disabled. The card marker remains the durable duplicate check.
    concurrency:
      group: project-push-card-${{ needs.identify.outputs.key }}
      cancel-in-progress: false
    steps:
      - name: Create one draft card in the existing In Progress column
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_PUSH_CARDS_TOKEN }}
          PUSH_JSON: ${{ needs.identify.outputs.push }}
          PUSH_KEY: ${{ needs.identify.outputs.key }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const push = JSON.parse(process.env.PUSH_JSON);
          const payload = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const { PROJECT_ID: projectId, STATUS_FIELD_ID: fieldId, IN_PROGRESS_OPTION_ID: optionId } = process.env;
          const repository = process.env.EXPECTED_REPOSITORY;
          if (!process.env.PROJECT_TOKEN) throw new Error('Configure the PROJECT_PUSH_CARDS_TOKEN repository secret with project write access first.');
          const key = createHash('sha256').update(JSON.stringify([
            push.repository, push.ref, push.before, push.after, push.id,
          ])).digest('hex');
          if (push.repository !== repository || key !== process.env.PUSH_KEY) throw new Error('Push identity mismatch.');
          const marker = `<!-- pos-project-push:v1:${key} -->`;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const summary = message => appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${message}\n`);
          async function graphql(query, variables) {
            const response = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.PROJECT_TOKEN}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables }), signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Projects API failed: HTTP ${response.status}`);
            const result = await response.json();
            if (result.errors?.length) throw new Error(`Projects API: ${result.errors.map(error => error.message).join('; ')}`);
            if (!result.data) throw new Error('Projects API returned no data.');
            return result.data;
          }
          async function rest(path) {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
              headers: { Authorization: `Bearer ${process.env.GH_READ_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Read commit metadata failed: HTTP ${response.status}`);
            return response.json();
          }
          const config = await graphql(`query($id: ID!, $field: String!) {
            node(id: $id) { ... on ProjectV2 {
              id title number url closed owner { ... on User { login } }
              field(name: $field) { ... on ProjectV2SingleSelectField { id name options { id name } } }
            } }
          }`, { id: projectId, field: 'Status' });
          const project = config.node;
          if (!project || project.title !== 'POS_WEB_FIREBASE' || project.number !== 2 || project.closed ||
              project.owner?.login !== 'RohitSensible' || project.url !== 'https://github.com/users/RohitSensible/projects/2' ||
              project.field?.id !== fieldId || !project.field.options.some(option => option.id === optionId && option.name === 'In Progress')) {
            throw new Error('Project/Status configuration does not match the approved existing board. No write performed.');
          }
          async function findExisting() {
            const found = [];
            let cursor = null;
            do {
              const data = await graphql(`query($id: ID!, $cursor: String) {
                node(id: $id) { ... on ProjectV2 {
                  items(first: 100, after: $cursor, archivedStates: [ARCHIVED, NOT_ARCHIVED]) {
                    nodes { id isArchived content { ... on DraftIssue { body } }
                      fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { optionId } }
                    }
                    pageInfo { hasNextPage endCursor }
                  }
                } }
              }`, { id: projectId, cursor });
              const items = data.node?.items;
              if (!items) throw new Error('Cannot complete duplicate scan. No card will be created.');
              for (const item of items.nodes) {
                if (!item) throw new Error('Unreadable project item during duplicate scan.');
                if (item.content?.body?.split('\n').includes(marker)) found.push(item);
              }
              const next = items.pageInfo;
              if (next.hasNextPage && (!next.endCursor || next.endCursor === cursor)) throw new Error('Invalid project pagination.');
              cursor = next.hasNextPage ? next.endCursor : null;
            } while (cursor);
            return found;
          }
          function skipExisting(items) {
            if (!items.length) return false;
            if (items.length !== 1) throw new Error('Multiple existing cards have this push marker; no existing cards were changed.');
            if (items[0].fieldValueByName?.optionId !== optionId) {
              throw new Error(`Push card ${items[0].id} already exists with another/missing status. No duplicate or existing-card update performed; inspect the partial run or built-in automation.`);
            }
            summary(`This push already has a card (including archived items): \`${items[0].id}\`. No changes made.`);
            return true;
          }
          if (skipExisting(await findExisting())) process.exit(0);

          let commits = [];
          const zeroBefore = /^0+$/.test(push.before);
          const payloadCount = payload.size ?? payload.distinct_size;
          const completePayload = !push.historical && Array.isArray(payload.commits) &&
            payload.commits.length < 2048 && (payloadCount === undefined ||
              (Number.isSafeInteger(payloadCount) && payloadCount === payload.commits.length));
          if (completePayload) {
            // The original push is authoritative, including force pushes and new
            // branches. A later comparison can describe a different commit set.
            commits = payload.commits.map(commit => ({ sha: commit.id, message: commit.message }));
          } else if (!zeroBefore) {
            // Pagination is essential: the default comparison response can truncate commits.
            let total;
            for (let page = 1; ; page++) {
              const comparison = await rest(`compare/${push.before}...${push.after}?per_page=100&page=${page}`);
              if (page === 1) total = comparison.total_commits;
              if (!Number.isSafeInteger(total) || total < 0 || comparison.total_commits !== total) throw new Error('Unreliable comparison commit count.');
              commits.push(...comparison.commits);
              if (commits.length >= total) break;
              if (!comparison.commits.length || page >= 100) throw new Error('Incomplete comparison; refusing to omit commits.');
            }
            if (commits.length !== total) throw new Error('Comparison commit count mismatch.');
            commits = commits.map(commit => ({ sha: commit.sha, message: commit.commit.message }));
            if (!push.historical && Array.isArray(payload.commits) && payload.commits.some(commit => !commits.some(item => item.sha === commit.id))) {
              throw new Error('Push payload and comparison disagree; refusing an incomplete card.');
            }
          } else {
            throw new Error('Cannot establish the complete commit list for this new branch; no misleading card created.');
          }
          if (new Set(commits.map(commit => commit.sha)).size !== commits.length ||
              commits.some(commit => !/^[0-9a-f]{40}$/.test(commit.sha) || typeof commit.message !== 'string')) {
            throw new Error('Invalid or duplicate commit metadata.');
          }
          const head = await rest(`commits/${push.after}`);
          if (head.sha !== push.after) throw new Error('Head commit mismatch.');
          if (push.historical && (commits.length !== 1 || commits[0].sha !== push.after || head.commit.message.split('\n')[0] !== 'improved responsive layouts')) {
            throw new Error('Historical push no longer matches the verified comparison.');
          }
          const branch = push.ref.slice('refs/heads/'.length);
          const subject = head.commit.message.split(/\r?\n/)[0].replace(/[\x00-\x1f\x7f]/g, ' ').trim();
          const title = Array.from(`Code Push — ${branch} — ${subject}`).slice(0, 256).join('');
          // Escape commit text as Markdown data (never shell code or hidden HTML).
          const md = value => String(value).replace(/([\\`*_{}\[\]()<>#+.!|~-])/g, '\\$1');
          const comparisonUrl = !push.historical && typeof payload.compare === 'string' &&
            payload.compare.startsWith(`https://github.com/${repository}/compare/`) ? payload.compare :
            `https://github.com/${repository}/compare/${push.before}...${push.after}`;
          const body = [
            marker, '', `Repository: ${repository}`, `Branch: ${md(branch)}`,
            `Push date (UTC; ${push.historical ? 'GitHub PushEvent' : 'original push payload repository.pushed_at'}): ${push.createdAt}`,
            `${push.historical ? 'Push event ID' : 'Push identifier'}: ${push.id}`,
            `Before SHA: ${push.before}`, `After SHA: ${push.after}`,
            `[Push comparison](${comparisonUrl})`, '',
            '### Commits in this push', '',
            ...(commits.length ? commits.flatMap(commit => [
              `- [${commit.sha}](https://github.com/${repository}/commit/${commit.sha})`,
              ...commit.message.split(/\r?\n/).map(line => `  ${md(line)}`), '',
            ]) : ['No new commits introduced; this push updated the branch reference.', '',
              `Head: [${push.after}](https://github.com/${repository}/commit/${push.after})`, md(head.commit.message)]),
          ].join('\n');
          // Leave margin below GitHub text limits; never silently truncate commit details.
          if (Buffer.byteLength(body, 'utf8') > 60000) throw new Error('Complete push details exceed the safe draft body size. No truncated card created.');

          // Re-scan immediately before the mutation while holding this push's lock.
          if (skipExisting(await findExisting())) process.exit(0);
          let itemId;
          try {
            // Do not automatically retry this mutation: a timeout may still have created
            // the card. A rerun must scan for its durable marker before any new write.
            const created = await graphql(`mutation($input: AddProjectV2DraftIssueInput!) {
              addProjectV2DraftIssue(input: $input) { projectItem { id } }
            }`, { input: { projectId, title, body, clientMutationId: key } });
            itemId = created.addProjectV2DraftIssue?.projectItem?.id;
            if (!itemId) throw new Error('Create response has no item ID.');
          } catch (error) {
            summary('Draft creation failed or its result is uncertain. Do not create a replacement manually; inspect the board and rerun for a marker check.');
            throw error;
          }
          summary(`Created draft item \`${itemId}\` for push \`${push.id}\`.`);
          // Only the item created by THIS run may be assigned/reassigned. Existing
          // cards are never edited, even after an earlier run's partial failure.
          let statusError = 'Status was changed by another automation.';
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              // Retrying this same field assignment is safe; never retry draft creation.
              await graphql(`mutation($input: UpdateProjectV2ItemFieldValueInput!) {
                updateProjectV2ItemFieldValue(input: $input) { projectV2Item { id } }
              }`, { input: { projectId, itemId, fieldId, value: { singleSelectOptionId: optionId } } });
              await sleep(5000);
              const state = await graphql(`query($id: ID!) { node(id: $id) { ... on ProjectV2Item {
                fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { optionId } }
              } } }`, { id: itemId });
              if (state.node?.fieldValueByName?.optionId === optionId) {
                summary(`Verified **In Progress** on the [existing project board](${project.url}).`);
                process.exit(0);
              }
            } catch (error) {
              statusError = error.message;
            }
            if (attempt < 2) await sleep(5000);
          }
          throw new Error(`Draft ${itemId} exists, but In Progress could not be verified: ${statusError} No replacement card will be created.`);
          NODE
